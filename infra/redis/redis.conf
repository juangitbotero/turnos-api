# =============================================================================
# Redis Configuration — Turnos Development
# =============================================================================

# Bind to all interfaces inside Docker network
bind 0.0.0.0

# Port
port 6379

# No password in dev (will be set in staging/production)
# requirepass your_password_here

# =============================================================================
# Persistence — AOF (Append Only File)
# Best for data safety — every write is logged
# =============================================================================
appendonly yes
appendfilename "turnos.aof"
appendfsync everysec

# RDB snapshot as backup (every 60s if at least 1 key changed)
save 60 1
save 300 10
save 900 1
dbfilename turnos-dump.rdb
dir /data

# =============================================================================
# Memory Management
# =============================================================================
maxmemory 256mb
maxmemory-policy allkeys-lru

# =============================================================================
# Logging
# =============================================================================
loglevel notice
logfile ""

# =============================================================================
# Performance
# =============================================================================
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Enable keyspace notifications for BullMQ (job queue events)
notify-keyspace-events "Ex"
