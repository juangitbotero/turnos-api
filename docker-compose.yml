# =============================================================================
# Turnos App — Docker Compose (Development)
# =============================================================================
# Services:
#   • postgres  — PostgreSQL 16 + PostGIS 3.4  (port 5432)
#   • redis     — Redis 7 with AOF persistence  (port 6379)
#   • pgadmin   — DB GUI                        (port 5050)
#   • redis-ui  — Redis Commander GUI           (port 8085)
#
# Usage:
#   npm run db:start   → start all services in background
#   npm run db:stop    → stop all services
#   npm run db:reset   → wipe volumes and restart fresh
#   npm run db:logs    → tail all service logs
# =============================================================================

services:

  # ─── PostgreSQL 16 + PostGIS 3.4 ───────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: turnos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos_dev_password
      POSTGRES_DB: turnos_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U turnos -d turnos_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - turnos_net

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: turnos_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - turnos_net

  # ─── pgAdmin 4 (Database GUI) ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: turnos_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@turnos.app
      PGADMIN_DEFAULT_PASSWORD: turnos_admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - turnos_net

  # ─── Redis Commander (Redis GUI) ──────────────────────────────────────────
  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: turnos_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8085:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - turnos_net

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: turnos_postgres_data
  redis_data:
    name: turnos_redis_data
  pgadmin_data:
    name: turnos_pgadmin_data

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  turnos_net:
    name: turnos_network
    driver: bridge
